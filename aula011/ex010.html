<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        

        #velocidade {
            width: 100px;
        }

        section {
            height: 30vh;
            display: flex;  
            align-items: center;
            
        }

        div {
            width: 200px;
            height: 200px;
            padding: 10px;
            border: 2px solid black;
        }


    </style>
</head>
<body>
    <h1>Teste de Velocidade</h1>    

    Informe a Velocidade: <input type="number" name="velocidade" id="velocidade"> <strong>Km/h</strong>
    <p><input type="button" value="Enviar" onclick="kilometros()"></p>
    <section>
        <div id="divresultado">
        </div>
    </section>

    <script>
        function kilometros() {
            var ligacao, jsvelocidade, jsresultado


            ligacao = document.querySelector("#velocidade")
            jsvelocidade = Number(ligacao.value)
            jsresultado = document.querySelector("#divresultado")
            jsresultado.innerHTML = `<p>Você percorreu ${jsvelocidade} Km/h</p>`
            if (jsvelocidade > 60) {
                jsresultado.innerHTML += `<p>Você ultrapassou o limite de velocidade, <strong>MULTADO!</strong></p>`  
            } else {
                jsresultado.innerHTML += `<p>continue sem ultrapassar os limites :)</p>`  
            }

            jsresultado.innerHTML += "<p>Dirija sempre utilizando o cinto de segurança.</p>"
        }
    </script>
</body>
</html>
