<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            background-color: #05af05;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
            font-size: 2em;
        }
    </style>
</head>
<body>
    <div id="inter">Interaja...</div>

    <script>
        var i

        i = document.querySelector("#inter")

        i.addEventListener("click", clicar)
        i.addEventListener("mouseenter", entrar)
        i.addEventListener("mouseout", saiu)

        function clicar() {
            i.innerText = "clicou"
            i.style.background = "red"
        }

        function entrar() {
            i.innerText = "Entrou"
            i.style.background = "blue"
        }

        function saiu() {
            i.innerText = "Saiu"
            i.style.background = "#05af05"
        }

    </script>
</body>
</html>
